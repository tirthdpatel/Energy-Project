name: Refresh CEA datasets

# Keeps the data behind the Simple view's sector dashboards (/api/sectors)
# current. The other two scheduled workflows run the main extractor suite and
# write to india_energy_scraper/output and web/backend/data; neither touches
# web/frontend/api/data/scraped/cea, which is what the live site actually reads.
#
# CEA publishes monthly, so most runs find nothing new. The extractor compares
# the fetched data against the snapshot on disk and writes only on a real
# change, so an unchanged day commits nothing. The schedule is daily rather
# than monthly because cea.nic.in is unreliable — it regularly answers with
# "Connection failed" under a 200 — and a daily retry picks up each monthly
# release shortly after it lands instead of waiting for the next month.

on:
  schedule:
    # 02:30 UTC / 08:00 IST
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cea-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The repo references an Energy-Project-Reference submodule that has
          # no .gitmodules entry; skip submodules so checkout stays clean.
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip httpx

      - name: Refresh CEA snapshot
        id: refresh
        working-directory: ./india_energy_scraper
        run: |
          set +e
          result=$(python -m scrapers.cea_extractor --keep 2 2>refresh.log)
          rc=$?
          set -e
          cat refresh.log
          if [ $rc -ne 0 ]; then
            # cea.nic.in is frequently down. Surface it as a warning rather than
            # a daily red X, but make it visible in the run summary so a
            # prolonged outage is not mistaken for "nothing to update".
            echo "::warning::CEA refresh failed — previous snapshot left untouched. See log above."
            {
              echo "### CEA refresh failed"
              echo ""
              echo "The upstream API did not return usable data. The existing snapshot is unchanged."
              echo ""
              echo '```'
              tail -n 20 refresh.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "outcome=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "changed" ]; then
            echo "### CEA data updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### CEA data unchanged" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the new snapshot is servable
        if: steps.refresh.outputs.outcome == 'changed'
        working-directory: ./india_energy_scraper
        run: python -m scrapers.cea_extractor --check

      - name: Commit updated snapshot
        id: commit
        if: steps.refresh.outputs.outcome == 'changed'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/frontend/api/data/scraped/cea
          if git diff --cached --quiet; then
            echo "nothing staged"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): refresh CEA snapshot"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushing redeploys Vercel automatically. Render only auto-deploys once
      # its GitHub app is authorised on this repo; until then this deploy hook
      # covers it. Create the hook in the Render dashboard under
      # Settings -> Deploy Hook and store it as the RENDER_DEPLOY_HOOK_URL
      # repository secret. The step is skipped when the secret is absent.
      - name: Trigger Render deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not set — skipping Render deploy."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "Render deploy hook responded $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
